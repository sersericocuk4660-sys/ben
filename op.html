/* Düzen: editoryal dergi sayfası. Sıcak krem zemin, 300 ağırlıkta büyük başlıklar, mono etiketler, 4px köşeler, gölgesiz. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151412; --linen:#1e1c19; --stone:#2b2824; --hair:#36322d; --ink:#f1eee9; --text:#cfcac1; --muted:#a09b92;
  --card:#25221f; --violet:#9aa0ff; --btn-bg:#f1eee9; --btn-fg:#111111; --field-line:#5b574f; --danger:#ff8b8f; color-scheme:dark;}}
:root[data-theme="dark"]{

*{box-sizing:border-box}

/* ---------- Oda ölçüsü hesaplayıcı ---------- */
function dims(b){
  var m=String(b||'').match(/(\d+(?:[.,]\d+)?)\s*[×xX*]\s*(\d+(?:[.,]\d+)?)/);if(!m)return null;
  var w=parseFloat(m[1].replace(',','.')),h=parseFloat(m[2].replace(',','.'));
  if(!(w>0&&h>0))return null;
  if(!/cm/i.test(b)&&w<=20&&h<=20){w*=100;h*=100;}
  return [Math.round(w),Math.round(h)];
}
function pm(v){var n=parseFloat(String(v).replace(',','.'));return n>0?n:0;}
function fmtM(v){return (Math.round(v*100)/100).toString().replace('.',',');}
function calcSizes(){
  var seen={},l=[];
  S.products.forEach(function(p){
    if(p.tukendi)return;
    p.olculer.forEach(function(z){var d=dims(z.b);if(!d)return;var k=d[0]+'x'+d[1];if(!seen[k]){seen[k]=1;l.push({w:d[0],h:d[1]});}});
  });
  return l;
}
function calcResultHTML(){
  var w=pm(calc.w),h=pm(calc.h),mg=Number(calc.m)||50;
  if(!(w>=1&&h>=1&&w<=20&&h<=20))return '<p class="hint">Odanızın en ve boyunu metre olarak yazın. Örnek: 3,5 ve 4,5.</p>';
  var fw=w*100-2*mg,fh=h*100-2*mg,fits=[];
  calcSizes().forEach(function(s){if((s.w<=fw&&s.h<=fh)||(s.h<=fw&&s.w<=fh))fits.push(s);});
  fits.sort(function(a,b){return b.w*b.h-a.w*a.h;});
  var head='<span class="mono">Oda '+fmtM(w)+' × '+fmtM(h)+' m · her kenarda '+mg+' cm boşluk</span>';
  var ask=wa('Merhaba, '+fmtM(w)+' × '+fmtM(h)+' m odam için halı ölçüsü önerir misiniz?');
  if(!fits.length)return head+'<h3>Bu oda için listede uygun hazır ölçü yok.</h3><p class="hint">Ölçü önermemiz için bize yazabilirsiniz.</p><div><a class="pill out sm" href="'+esc(ask||'#iletisim')+'"'+(ask?' target="_blank" rel="noopener"':'')+'>'+WIC+'WhatsApp ile sor</a></div>';
  var best=fits[0],alt=null,k;
  for(k=1;k<fits.length;k++){if(fits[k].w*fits[k].h<best.w*best.h){alt=fits[k];break;}}
  var rows=[];
  S.products.forEach(function(p,i){
    if(p.tukendi)return;
    for(var j=0;j<p.olculer.length;j++){var d=dims(p.olculer[j].b);if(d&&d[0]===best.w&&d[1]===best.h){rows.push({p:p,i:i,j:j,f:finalOf(p,p.olculer[j]),z:p.olculer[j]});break;}}
  });
  rows.sort(function(a,b){return (a.f==null?1e9:a.f)-(b.f==null?1e9:b.f);});
  return head+'<h3>Önerilen ölçü: '+best.w+'×'+best.h+' cm</h3><p class="meta" style="margin:0">'+fmtA(best.w*best.h/10000)+(alt?' · Daha küçük seçenek: '+alt.w+'×'+alt.h+' cm':'')+'</p>'
    +rows.slice(0,6).map(function(r){
      return '<div class="rc"><span class="m">'+media(r.p,r.i)+'</span><div class="t"><b>'+esc(r.p.ad)+'</b><span class="meta" style="display:block;font-size:14px;color:var(--muted)">'+esc(r.p.kat)+' · '+esc(r.z.b)+'</span></div>'+priceHTML(r.p,r.z)+'<button class="pill out sm" data-act="detail" data-id="'+esc(r.p.id)+'" data-j="'+r.j+'">Detay</button></div>';
    }).join('');
}

/* ---------- Yönetim girişi: kullanıcı adı + şifre (PBKDF2 özeti olarak saklanır) ---------- */
var AK='erdeko-yonetim';
function markAuth(){try{sessionStorage.setItem(AK,String(Date.now()));}catch(e){}}
function clearMark(){try{sessionStorage.removeItem(AK);}catch(e){}}
function sessOK(){try{var t=+sessionStorage.getItem(AK);return t>0&&Date.now()-t<1800000;}catch(e){return false;}}
function b64(buf){var a=new Uint8Array(buf),s='',i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function derive(u,pw,salt,iter){
  var enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(u.toLowerCase()+':'+pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},key,256));
}
async function mkAuth(u,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  return {u:u.toLowerCase(),s:b64(salt),i:150000,h:await derive(u,pw,salt,150000)};
}
async function checkAuth(a,u,pw){
  if(!a||!a.s||!a.h)return false;
  var h=await derive(u,pw,unb64(a.s),a.i||150000),d=h.length^a.h.length,i;
  for(i=0;i<h.length&&i<a.h.length;i++)d|=h.charCodeAt(i)^a.h.charCodeAt(i);
  return d===0&&u.toLowerCase()===a.u;
}

document.addEventListener('submit',async function(e){
  var f=e.target;
  if(f.id==='lgf'){
    e.preventDefault();if(gateBusy)return;
    var setup=gate==='setup',u=f.elements.username.value.trim(),pw=f.elements.password.value,btn=f.querySelector('[type=submit]');
    if(!(window.crypto&&crypto.subtle)){say('lg-msg','Bu tarayıcı güvenli girişi desteklemiyor. Sayfayı Safari veya Chrome ile açın.',true);return;}
    if(!u||!pw){say('lg-msg','Kullanıcı adı ve şifreyi yazın.',true);return;}

    if(setup){
      if(pw.length<8){say('lg-msg','Şifre en az 8 karakter olmalı.',true);return;}
      if(pw!==f.elements.password2.value){say('lg-msg','İki şifre aynı değil.',true);return;}
    }
    gateBusy=true;btn.disabled=true;say('lg-msg','Kontrol ediliyor…',false);
    try{
      if(setup){var a=await mkAuth(u,pw);openApp();draft.auth=a;renderPanel();save();}
      else if(await checkAuth(S.auth,u,pw)){fails=0;openApp();}
      else{fails++;if(fails>=5){fails=0;lockUntil=Date.now()+30000;}say('lg-msg','Kullanıcı adı veya şifre hatalı.',true);f.elements.password.value='';btn.disabled=false;}
    }catch(err){say('lg-msg','Giriş yapılamadı. Sayfayı yenileyip tekrar deneyin.',true);btn.disabled=false;}
    gateBusy=false;
  }else if(f.id==='crf'){
    e.preventDefault();if(!draft)return;
    var el=f.elements,u2=el.username.value.trim(),cur=el.current.value,n1=el.next.value,n2=el.next2.value;
    if(!(window.crypto&&crypto.subtle)){say('cr-msg','Bu tarayıcı güvenli girişi desteklemiyor.',true);return;}
    if(!u2){say('cr-msg','Kullanıcı adını yazın.',true);return;}
    if(!cur){say('cr-msg','Mevcut şifrenizi yazın.',true);return;}
    if(n1&&n1.length<8){say('cr-msg','Yeni şifre en az 8 karakter olmalı.',true);return;}
    if(n1!==n2){say('cr-msg','Yeni şifreler aynı değil.',true);return;}
    say('cr-msg','Kontrol ediliyor…',false);
    try{
      var cu=draft.auth||S.auth;
      if(!(await checkAuth(cu,cu.u,cur))){say('cr-msg','Mevcut şifre hatalı.',true);return;}
      draft.auth=await mkAuth(u2,n1||cur);
      setStatus('Giriş bilgileri güncellendi. Kalıcı olması için Kaydet ve yayınla düğmesine basın.');renderPanel();
    }catch(err){say('cr-msg','Güncellenemedi. Tekrar deneyin.',true);}
  }
});

function toImg(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
      var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82));};
      im.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

function buildDoc(){
  var css=document.getElementById('css').textContent,code=document.getElementById('code').textContent;
  var seed=JSON.stringify(S).replace(/</g,'\\u003c');
  var reset='';
  var sts=document.head.querySelectorAll('style');
  for(var i=0;i<sts.length;i++){if(sts[i].textContent.indexOf('[hidden]')>=0){reset=sts[i].textContent;break;}}
  var T='<'+'script',E='<'+'/script>';
  var link='<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:wght@300;400&display=swap" rel="stylesheet">';
  var content='<title>'+esc(document.title)+'</title>'+link+'<style id="css">'+css+'</style><div id="site" lang="tr"></div><div id="panel" lang="tr"></div><div id="toast" class="toast" role="status" hidden></div>'
    +T+' type="application/json" id="seed">'+seed+E+T+' id="code">'+code+E;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+content+'</body></html>';
}

async function save(){
  if(saving||!draft)return;
  var cl=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
  if(!cl){setStatus('Yayınlama bu görünümde kullanılamıyor. Sayfayı Claude içinde açın.',true);renderPanel();return;}
  if(draft.auth)S.auth=clone(draft.auth);
  S.shop=clone(draft.shop);
  S.m2=Math.max(0,Math.round(Number(draft.m2)||0));
  S.products=clone(draft.products).map(cleanProd);
  S.opts=Object.assign({hesap:true,fav:true,sss:true,insta:true},clone(draft.opts||{}));
  S.sss=(draft.sss||[]).map(function(q){return {q:String(q.q||'').trim(),a:String(q.a||'').trim()};}).filter(function(q){return q.q&&q.a;});
  S.yorumlar=(draft.yorumlar||[]).map(function(y){return {ad:String(y.ad||'').trim(),metin:String(y.metin||'').trim()};}).filter(function(y){return y.metin;});
  saving=true;setStatus('Yayınlanıyor…');renderPanel();
  try{
    await cl.publish(buildDoc());
    saving=false;renderSite();setStatus('Yayınlandı. Sayfa yenileniyor…');renderPanel();
  }catch(e){
    saving=false;
    var c=e&&e.code;
    setStatus(c==='conflict'?'Sayfa başka bir yerden değişmiş. Sayfayı yenileyip tekrar deneyin.':(c==='not_granted'||c==='not_writer')?'Bu sayfayı yayınlama yetkiniz yok.':'Yayınlanamadı. Biraz sonra tekrar deneyin.',true);
    renderPanel();
  }
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,row=t.closest('.row'),i=row?+row.dataset.i:-1;
  if(a==='navcat'){e.preventDefault();filter=t.dataset.v;renderSite();var cl2=document.getElementById('koleksiyon');if(cl2)cl2.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
  else if(a==='filter'){filter=t.dataset.v;renderSite();var s=document.querySelector('.seg.on');if(s)s.focus();}
  else if(a==='open')openPanel();
  else if(a==='close')closePanel();
  else if(a==='tab'){tab=t.dataset.v;renderPanel();}
  else if(a==='add'){draft.products.push({id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1000),ad:'Yeni halı',kat:'Şönil',malzeme:'',m2:0,olculer:[{b:'160×230 cm'},{b:'200×290 cm'},{b:'240×340 cm'}],tukendi:false,img:'',imgs:[],ip:'',tuy:'',bakim:'',aciklama:'',etiket:'',indirim:0,stok:0,oncelik:false});renderPanel();var pb=$panel.querySelector('.pb');if(pb)pb.scrollTop=pb.scrollHeight;}
  else if(a==='del'){confirmDel=draft.products[i].id;renderPanel();}
  else if(a==='delno'){confirmDel=null;renderPanel();}
  else if(a==='delok'){draft.products.splice(i,1);confirmDel=null;renderPanel();}
  else if(a==='rmimg'){draft.products[i].img='';renderPanel();}
  else if(a==='addsize'){var ol=draft.products[i].olculer;ol.push({b:''});renderPanel();var ni=$panel.querySelector('#p'+i+'-z'+(ol.length-1)+'-b');if(ni)ni.focus();}
  else if(a==='rmsize'){var sr=t.closest('.srow'),ol2=draft.products[i].olculer;if(sr&&ol2.length>1){ol2.splice(+sr.dataset.j,1);renderPanel();}}
  else if(a==='scr'){var ch=t.closest('.card').querySelector('.chips');if(ch)ch.scrollBy({left:(+t.dataset.d)*180,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
  else if(a==='size'){var sc=t.closest('.chips').scrollLeft;sel[t.dataset.id]=+t.dataset.v;renderSite();var nc=document.querySelector('.chips[data-id="'+t.dataset.id+'"]');if(nc)nc.scrollLeft=sc;var sb=document.querySelector('[data-act="size"][data-id="'+t.dataset.id+'"][data-v="'+t.dataset.v+'"]');if(sb)sb.focus({preventScroll:true});}
  else if(a==='detail'){var did=t.dataset.id;detailId=did;detailImg=0;favOpen=false;if(t.dataset.j!==undefined&&t.dataset.j!==''){sel[did]=+t.dataset.j;renderSite();}renderModal(true);}
  else if(a==='mclose'||(a==='mbg'&&e.target===t)){detailId=null;favOpen=false;renderModal();}
  else if(a==='dimg'){detailImg=+t.dataset.v;renderModal();}
  else if(a==='dsize'){sel[detailId]=+t.dataset.v;renderSite();renderModal();}
  else if(a==='fav'){var fid=t.dataset.id;toggleFav(fid);renderSite();if(detailId||favOpen)renderModal();else{var fb=document.querySelector('.fav[data-id="'+fid+'"]');if(fb)fb.focus({preventScroll:true});}}
  else if(a==='favopen'){favOpen=true;detailId=null;renderModal(true);}
  else if(a==='up'&&i>0){var u1=draft.products[i];draft.products[i]=draft.products[i-1];draft.products[i-1]=u1;renderPanel();}
  else if(a==='dn'&&i>=0&&i<draft.products.length-1){var d1=draft.products[i];draft.products[i]=draft.products[i+1];draft.products[i+1]=d1;renderPanel();}
  else if(a==='rmx'){draft.products[i].imgs.splice(+t.dataset.v,1);renderPanel();}
  else if(a==='bulk'){
    var pe=document.getElementById('g-pct'),pc=pe?parseFloat(pe.value):NaN;
    if(!isFinite(pc)||pc===0||pc<-90||pc>500){setStatus('Yüzde değerini yazın (örnek: 10 veya -5).',true);renderPanel();}
    else{
      var fx=function(n){return n>0?Math.max(1,Math.round(n*(1+pc/100))):0;};
      draft.m2=fx(Number(draft.m2));draft.products.forEach(function(p){p.m2=fx(Number(p.m2));});
      setStatus('Tüm m² fiyatlarına %'+pc+' uygulandı. Kaydet ve yayınla ile sitede görünür.');renderPanel();
    }
  }
  else if(a==='addy'){draft.yorumlar.push({ad:'',metin:''});renderPanel();}
  else if(a==='rmy'){var yr=t.closest('.yr');if(yr){draft.yorumlar.splice(+yr.dataset.i,1);renderPanel();}}
  else if(a==='addq'){draft.sss.push({q:'',a:''});renderPanel();}
  else if(a==='rmq'){var qr=t.closest('.yr');if(qr){draft.sss.splice(+qr.dataset.i,1);renderPanel();}}
  else if(a==='gclose')closePanel();
  else if(a==='logout'){authed=false;clearMark();closePanel();}
  else if(a==='save')save();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.calc){calcIn(t);return;}
  if(!draft)return;
  if(t.dataset.o){draft.opts[t.dataset.o]=t.checked;return;}
  if(t.dataset.y||t.dataset.qa){
    var yrw=t.closest('.yr');
    if(yrw){(t.dataset.y?draft.yorumlar:draft.sss)[+yrw.dataset.i][t.dataset.y||t.dataset.qa]=t.value;}
    return;
  }
  if(t.dataset.s){draft.shop[t.dataset.s]=t.value;if(t.dataset.s==='phone'||t.dataset.s==='whatsapp')waUpdate();return;}
  if(t.dataset.g){draft[t.dataset.g]=t.value===''?0:Number(t.value);updatePreviews();return;}
  if(t.dataset.z){
    var rr=t.closest('.row'),sr=t.closest('.srow');
    if(rr&&sr){draft.products[+rr.dataset.i].olculer[+sr.dataset.j][t.dataset.z]=t.value;updatePreviews();}
    return;
  }
  if(t.dataset.f){
    var r=t.closest('.row');if(!r)return;
    var p=draft.products[+r.dataset.i];
    p[t.dataset.f]=t.type==='checkbox'?t.checked:(t.type==='number'?(t.value===''?0:Number(t.value)):t.value);
    if(t.dataset.f==='m2')updatePreviews();
  }
});
document.addEventListener('change',async function(e){
  var t=e.target;if(!draft||!t.dataset.file)return;
  var r=t.closest('.row'),f=t.files&&t.files[0];if(!r||!f)return;
  try{
    var pp=draft.products[+r.dataset.i],im2=await toImg(f,900);
    if(t.dataset.file==='x'){if(!Array.isArray(pp.imgs))pp.imgs=[];if(pp.imgs.length<4)pp.imgs.push(im2);}
    else pp.img=im2;
    setStatus('');
  }
  catch(err){setStatus('Resim okunamadı. Başka bir dosya deneyin.',true);}
  renderPanel();
});
